name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: flutter create --platforms=android --org com.atmosweather .

      - name: Ensure Android network permission
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          android = "http://schemas.android.com/apk/res/android"
          ET.register_namespace("android", android)
          tree = ET.parse(manifest)
          root = tree.getroot()
          permission = f"{{{android}}}name"
          if not any(
              node.tag == "uses-permission"
              and node.get(permission) == "android.permission.INTERNET"
              for node in root
          ):
              node = ET.Element("uses-permission")
              node.set(permission, "android.permission.INTERNET")
              root.insert(0, node)
              tree.write(manifest, encoding="utf-8", xml_declaration=True)
          PY

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: prakiraan-cuaca-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14